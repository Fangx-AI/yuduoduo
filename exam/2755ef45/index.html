d2cdc\",\"type\":\"single\",\"stem\":\"下列因素中，能够导致某种商品需求曲线上的点发生位移的是( )。\",\"options\":{\"A\":\"消费者收入\",\"B\":\"该商品的成本\",\"C\":\"该商品的税率\",\"D\":\"该商品自身的价格\"},\"answer\":[\"D\"],\"para\":[\"本题考查需求数量的变动。\",\"假定其他因素不变，只考虑需求和价格的关系，需求量的变动是沿着既定的需求曲线进行的，属于需求曲线上点的移动，故此题正确答案为D。由于消费者收入或消费者偏好等因素的变化引起的需求的相应变动，表现为需求曲线的位移。要注意区分。\"],\"num\":3},{\"id\":\"b27ee3dfc2\",\"type\":\"single\",\"stem\":\"流动资产周转率是对企业营运能力进行分析的指标之一，它是（ ）与全部流动资产的平均余额的比率。\",\"options\":{\"A\":\"利润\",\"B\":\"净利润\",\"C\":\"主营业务收入\",\"D\":\"营业收入净额\"},\"answer\":[\"D\"],\"para\":[\"本题考查流动资产周转率的概念。流动资产周转率是营业收入净额与全部流动资产的平均余额的比率。故D正确；ABC为干扰项，故不选。故本题正确选项为D。\"],\"num\":4},{\"id\":\"2270777a19\",\"type\":\"single\",\"stem\":\"工资可以分为名义工资和实际工资是因为( )。\",\"options\":{\"A\":\"价格总水平的波动\",\"B\":\"工资组成的不同\",\"C\":\"对经济的影响不同\",\"D\":\"劳动生产率不同\"},\"answer\":[\"A\"],\"para\":[\"本题考查价格总水平变动对工资的影响。由于价格总水平的波动，工资可以分为名义工资和实际工资。故A正确；BCD属于干扰项，故不选。\",\"故此题正确答案为A。\"],\"num\":5},{\"id\":\"5f3712656a\",\"type\":\"single\",\"stem\":\"反映企业生产经营成果的会计要素包括（ ）。\",\"options\":{\"A\":\"收入、费用、利润\",\"B\":\"资产、负债、所有者权益\",\"C\":\"收入、资产、利润\",\"D\":\"利润、资产、费用\"},\"answer\":[\"A\"],\"para\":[\"本题考查反映经营成果的会计要素。收入、费用、利润是反映企业生产经营成果的会计要素；资产、负债、所有者权益是反映财务状况的会计要素。故A正确；BCD属于干扰项，故不选；故本题正确选项为A。\"],\"num\":6},{\"id\":\"2a37f7a2be\",\"type\":\"single\",\"stem\":\"下列关于无效合同和可变更或可撤销合同的提法中，错误的是（ ）。\",\"options\":{\"A\":\"无效的合同自始没有法律约束力\",\"B\":\"合同部分无效，不影响其他部分效力的，其他部分仍然有效\",\"C\":\"对于可变更或者可撤销的合同，当事人没有提出请求的，人民法院或者仲裁机构可以主动予以撤销或变更\",\"D\":\"合同被确认为无效不影响合同中独立存在的有关解决争议方法的条款的效力\"},\"answer\":[\"C\"],\"para\":[\"本题考查效力存在瑕疵的合同。A正确，无效的合同自始没有法律约束力；B正确，合同部分无效，不影响其他部分效力的，其他部分仍然有效；C错误，对于可变更或者可撤销的合同，当事人没有提出请求的，人民法院或者仲裁机构不能主动予以撤销或变更；D正确，合同被确认为无效不影响合同中独立存在的有关解决争议方法的条款的效力。\",\"本题选择错误的，故此题正确答案为C。\"],\"num\":7},{\"id\":\"cee80b823c\",\"type\":\"single\",\"stem\":\"财政制度的核心是（ ）。\",\"options\":{\"A\":\"财政收入制度\",\"B\":\"财政支出制度\",\"C\":\"政府预算制度\",\"D\":\"国家金库制度\"},\"answer\":[\"C\"],\"para\":[\"本题考查政府预算制度。\",\"政府预算制度是财政制度的核心，是财政赖以存在的基础，是国家政治体制的重要组成部分。C项正确。ABD三项内容错误。\",\"故此题正确答案为C。\"],\"num\":8},{\"
